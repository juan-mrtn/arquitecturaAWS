services:
  floci:
    image: floci/floci:latest
    container_name: floci-aws-emulator
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb
      - DEFAULT_REGION=us-east-1
  init-dynamodb:
    image: amazon/aws-cli:latest
    depends_on:
      - floci
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: -c "until aws dynamodb list-tables --endpoint-url http://floci:4566 >/dev/null 2>&1; do sleep 2; done; aws dynamodb create-table --table-name CorporateData --attribute-definitions AttributeName=id,AttributeType=S --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST --endpoint-url http://floci:4566 || true; aws dynamodb create-table --table-name CorporateLog --attribute-definitions AttributeName=id,AttributeType=S --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST --endpoint-url http://floci:4566 || true; aws dynamodb put-item --table-name CorporateData --item '{\"id\":{\"S\":\"UADER-FCYT-IS2\"},\"telefono\":{\"S\":\"03442 33-0044\"},\"web\":{\"S\":\"http://www.fcyt.uader.edu.ar/nuevo\"},\"sede\":{\"S\":\"FCyT Concepcion del Uruguay\"}}' --endpoint-url http://floci:4566; "